name: Build and Deploy
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Бекенд (PHP) іде в корінь сайту roofkit.com.ua одним FTP-підключенням
      # (хостинг рве друге підключення поспіль). .env і vendor/ на сервері не чіпаємо.
      - name: Stage backend
        run: |
          cp -r backend/src build/src
          cp -r backend/api build/api
          find build/src build/api -name '.env' -delete
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./build/
          server-dir: /roofkit.com.ua/www/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env

